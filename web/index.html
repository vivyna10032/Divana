<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divana</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="brand">
      <div class="logo">D</div>
      <div>
        <div class="name">Divana</div>
        <div class="sub">AI 学习伙伴</div>
      </div>
    </div>
    <button class="nav-item active" data-view="chat" type="button">对话</button>
    <button class="nav-item" data-view="notes" type="button">知识库</button>
  </nav>

  <!-- ------------------------------------------------ 对话 -->
  <section class="view" id="view-chat">
    <main class="chat">
      <div id="messages">
        <div class="empty">
          <div class="big">你好，我是 Divana</div>
          <div>我记得你的学习目标，也知道你正在学什么。</div>
        </div>
      </div>

      <div class="quick" id="quick">
        <button type="button" data-prompt="我现在该学什么？">我现在该学什么？</button>
        <button type="button" data-prompt="帮我制定学习计划">帮我制定学习计划</button>
        <button type="button" data-prompt="总结今天的学习内容">总结今天的学习内容</button>
      </div>

      <form id="composer">
        <textarea id="input" rows="1" placeholder="有问题尽管问…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send" type="submit">发送</button>
      </form>
    </main>

    <aside class="side">
      <section class="panel">
        <h2>学习目标</h2>
        <div class="body" id="p-goal">读取中…</div>
      </section>
      <section class="panel">
        <h2>现在的位置</h2>
        <div class="body" id="p-now">读取中…</div>
      </section>
      <section class="panel">
        <h2>下一步</h2>
        <div class="body" id="p-next">读取中…</div>
      </section>
      <section class="panel">
        <h2>最近的笔记 <span class="count" id="n-count"></span></h2>
        <div id="notes"></div>
      </section>
      <section class="panel">
        <h2>这次对话</h2>
        <div class="actions">
          <button class="ghost" id="btn-summary" type="button">整理成笔记</button>
        </div>
        <div id="summary-out"></div>
      </section>
    </aside>
  </section>

  <!-- ------------------------------------------------ 知识库 -->
  <section class="view hidden" id="view-notes">
    <div class="notes-list">
      <div class="notes-head">
        <input id="note-search" type="search" placeholder="搜索标题、标签或正文…">
        <div class="tags" id="note-tags"></div>
      </div>
      <div id="note-items"><div class="hint">读取中…</div></div>
    </div>
    <article class="note-detail" id="note-detail">
      <div class="hint">从左边选一篇笔记</div>
    </article>
  </section>
</div>

<script src="/static/app.js"></script>
</body>
</html>
